org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# appVersion drives the published Maven coordinate. Default keeps the local
# `publishToMavenLocal` artifact pinned to a stable SNAPSHOT name so downstream
# consumers can depend on `0.1.0-SNAPSHOT` without chasing every commit
# hash. The publish workflow overrides it with the tag minus its leading v,
# for example `-PappVersion=0.2.0`, and the artifact lands in Central as that
# release.
appVersion=0.1.0-SNAPSHOT
