org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# appVersion drives the published Maven coordinate. The default is a placeholder
# no release will ever carry, so a local build is never mistaken for a version
# on Central and never goes stale after a release. A release passes the real
# one with -PappVersion, CI from the tag and a workstation by hand. The publish
# tasks refuse to send a version ending in -TEST to Central.
appVersion=9.9.9-TEST
