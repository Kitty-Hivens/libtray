name: EDT probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: EDT probe (${{ matrix.library }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        library: [ before, fixed ]
        shard: [ 1, 2 ]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Take the library from before the fix
        if: matrix.library == 'before'
        run: git checkout 075461a -- src/main
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew testClasses
      - name: Run the probe and the check next to the tasks a build runs beside them
        run: |
          bad=0
          for i in $(seq 1 40); do
            echo "=== probe run $i"
            ./gradlew -q --continue macEdtProbe macSmokeCheck test --rerun || bad=$((bad+1))
          done
          echo "runs with a stall or a failure: $bad of 40"
          [ "$bad" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: edt-probe-${{ matrix.library }}-${{ matrix.shard }}
          path: build/edt-probe
          if-no-files-found: ignore
