name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '22'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    # `check` covers each platform beyond the unit tests: on Linux the SNI
    # backend runs against a private session bus with the test as tray host
    # (sniHostTest), on macOS a status item is created, driven and closed
    # (macSmokeCheck), and on Windows the Win32 tests post the tray window
    # the shell's callbacks.
    name: Build & test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      # sniHostTest skips itself without dbus-daemon. Fail here instead, so
      # the end-to-end tests cannot quietly stop running in CI.
      - name: Require dbus-daemon
        if: runner.os == 'Linux'
        run: command -v dbus-daemon
      - name: Build + test
        run: ./gradlew build --stacktrace
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.name }}
          path: build/reports/tests
          retention-days: 7
