name: Publish

# A release is cut from a tag: tag vX.Y.Z, push it, and this signs the
# artifacts, uploads them to Maven Central and creates the GitHub release page
# from the version's CHANGELOG section. The version comes from the tag,
# not from gradle.properties -- the appVersion there is a 9.9.9-TEST placeholder
# for local builds, which the build refuses to publish to Central. The job runs in the
# maven-central environment, so the credentials sit behind that environment's
# approval rather than firing on any pushed tag.
on:
  push:
    tags: [ "v*", "[0-9]*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.2"
        required: true

env:
  JAVA_VERSION: '22'
  JAVA_DISTRIBUTION: 'temurin'

# Only the publish job writes, to create the release page.
permissions:
  contents: read

jobs:
  # The tag is what ships, so it goes through all of CI here rather than on the
  # trust that main was green when it was cut: the build and tests on Linux,
  # Windows and macOS, and the native image check on each of them.
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Maven Central
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    # contents: write is what lets the last step create the release page.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Resolve the version
        id: version
        env:
          # A dispatched run is where "v0.1.2" gets pasted in by hand; the tag
          # path has already stripped the v.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
          fi
          case "$v" in
            [0-9]*) ;;
            *) echo "::error::version '$v' does not start with a digit"; exit 1 ;;
          esac
          case "$v" in
            *[!0-9A-Za-z.-]*) echo "::error::version '$v' has characters a version does not"; exit 1 ;;
          esac
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # Central versions are immutable, and a reused one is rejected only at
      # the end of the upload -- after everything has been built and signed.
      - name: Guard the version
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          v="$VERSION"
          if curl -fsI -o /dev/null "https://repo1.maven.org/maven2/dev/hivens/libtray/$v/libtray-$v.pom"; then
            echo "::error::dev.hivens:libtray:$v is already on Central -- versions are immutable"
            exit 1
          fi
          echo "publishing $v"

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          # The in-memory key is what makes the build skip useGpgCmd; the
          # configuration cache is on in gradle.properties and the publish
          # tasks do not survive it.
          ./gradlew publishToMavenCentral \
            -PappVersion="$VERSION" \
            --no-configuration-cache

      # The GitHub release page for the tag, with that version's CHANGELOG
      # section as its notes. Only for a pushed tag, since a dispatched run has
      # no tag to hang a release on. It runs after the upload, so a page never
      # announces an artifact that failed to publish.
      - name: Release page
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          python3 .github/scripts/changelog_section.py CHANGELOG.md "$VERSION" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "libtray $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
